<!DOCTYPE html>
<html>
<head>
    <title>Adu Penalti 3D</title>
    <!-- Library Socket.io & QRCode -->
    <script src="/socket.io/socket.io.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <!-- Library Three.js (Untuk 3D) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <!-- Library GSAP (Untuk Animasi) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <style>
        body { margin: 0; overflow: hidden; background-color: #87CEEB; font-family: 'Segoe UI', sans-serif; color: white; }
        
        /* UI OVERLAYS */
        #ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 10; display: flex; flex-direction: column; align-items: center; }
        
        #lobby { background: rgba(0,0,0,0.8); width: 100%; height: 100%; display: flex; flex-direction: column; justify-content: center; align-items: center; pointer-events: auto; }
        #qrcode { background: white; padding: 20px; border-radius: 10px; margin: 20px; }
        
        #top-bar { background: rgba(0,0,0,0.7); padding: 10px 40px; border-radius: 0 0 20px 20px; text-align: center; display: none; }
        .score-board { font-size: 26px; font-weight: bold; }
        #status-text { font-size: 16px; color: #f1c40f; }

        #result-text { position: absolute; top: 40%; font-size: 50px; font-weight: bold; text-shadow: 3px 3px 10px black; opacity: 0; transform: scale(0.5); text-align: center; }
        
        /* Canvas 3D */
        #game-canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }
    </style>
</head>
<body>

    <!-- Layer UI HTML -->
    <div id="ui-layer">
        <div id="lobby">
            <h1>ROOM ADU PENALTI 3D ⚽</h1>
            <h2 id="room-code">Generating code...</h2>
            <div id="qrcode"></div>
            <h3>Menunggu 2 Pemain...</h3>
            <ul id="player-list" style="list-style: none; padding: 0; font-size: 20px;"></ul>
        </div>

        <div id="top-bar">
            <div class="score-board" id="score-board">Pemain 1 (0) - (0) Pemain 2</div>
            <div id="status-text">Bersiap untuk Ronde 1...</div>
        </div>

        <div id="result-text"></div>
    </div>

    <!-- Tempat render 3D -->
    <canvas id="game-canvas"></canvas>

    <script>
        // ==========================================
        // 1. SETUP SOCKET.IO & UI LOGIC
        // ==========================================
        const socket = io();
        let currentRoom = '';

        socket.emit('createRoom');

        socket.on('roomCreated', (roomId) => {
            currentRoom = roomId;
            document.getElementById('room-code').innerText = "KODE ROOM: " + roomId;
            // GANTI DENGAN IP LAPTOP KAMU!
            const playUrl = `http://172.25.205.19:3000/play.html?room=${roomId}`;
            new QRCode(document.getElementById("qrcode"), { text: playUrl, width: 200, height: 200 });
        });

        socket.on('updateLobby', (players) => {
            const list = document.getElementById('player-list');
            list.innerHTML = '';
            players.forEach(p => {
                list.innerHTML += `<li>✅ <b style="color:#2ecc71;">${p.name}</b> siap!</li>`;
            });
        });

        socket.on('gameStart', (game) => {
            document.getElementById('lobby').style.display = 'none';
            document.getElementById('top-bar').style.display = 'block';
            updateScoreBoard(game.players);
        });

        socket.on('playerMadeChoice', (data) => {
            document.getElementById('status-text').innerText = `${data.name} sudah mengunci pilihan!`;
        });

        function updateScoreBoard(players) {
            const p1 = players[0];
            const p2 = players[1];
            document.getElementById('score-board').innerHTML = `<span style="color:#ff6b6b">${p1.name}</span> (${p1.score}) - (${p2.score}) <span style="color:#4facfe">${p2.name}</span>`;
        }

        socket.on('gameOver', (winner) => {
            showResultText(`🏆 MATCH SELESAI 🏆<br>${winner.name} MENANG!`, '#f1c40f', 4000);
            document.getElementById('status-text').innerText = "Memulai ulang...";
            ball.position.set(0, -10, 0); // Sembunyikan bola
        });

        // ==========================================
        // 2. SETUP THREE.JS (DUNIA 3D)
        // ==========================================
        const canvas = document.getElementById('game-canvas');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87CEEB); // Langit biru

        // Kamera
        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 15, 30); // Posisi kamera agak di atas dan di belakang penendang
        camera.lookAt(0, 0, -20); // Melihat ke arah gawang

        // Renderer
        const renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;

        // Pencahayaan
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);
        const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight.position.set(20, 40, 20);
        dirLight.castShadow = true;
        scene.add(dirLight);

        // ==========================================
        // 3. MEMBUAT OBJEK 3D
        // ==========================================

        // A. Lapangan Hijau
        const fieldGeo = new THREE.PlaneGeometry(100, 100);
        const fieldMat = new THREE.MeshLambertMaterial({ color: 0x27ae60 });
        const field = new THREE.Mesh(fieldGeo, fieldMat);
        field.rotation.x = -Math.PI / 2;
        field.receiveShadow = true;
        scene.add(field);

        // B. Gawang
        const goalGroup = new THREE.Group();
        const postMat = new THREE.MeshLambertMaterial({ color: 0xffffff });
        const postGeo = new THREE.BoxGeometry(0.5, 8, 0.5);
        const leftPost = new THREE.Mesh(postGeo, postMat); leftPost.position.set(-10, 4, -20);
        const rightPost = new THREE.Mesh(postGeo, postMat); rightPost.position.set(10, 4, -20);
        const crossGeo = new THREE.BoxGeometry(20.5, 0.5, 0.5);
        const crossbar = new THREE.Mesh(crossGeo, postMat); crossbar.position.set(0, 8, -20);
        leftPost.castShadow = true; rightPost.castShadow = true; crossbar.castShadow = true;
        goalGroup.add(leftPost, rightPost, crossbar);
        scene.add(goalGroup);

        // C. Bola
        const ballGeo = new THREE.SphereGeometry(0.8, 16, 16);
        const ballMat = new THREE.MeshLambertMaterial({ color: 0xffffff });
        const ball = new THREE.Mesh(ballGeo, ballMat);
        ball.position.set(0, 0.8, 10); // Titik penalti
        ball.castShadow = true;
        scene.add(ball);

        // D. Fungsi Pembuat Karakter Blocky
        function createCharacter(color) {
            const group = new THREE.Group();
            const mat = new THREE.MeshLambertMaterial({ color: color });
            const skin = new THREE.MeshLambertMaterial({ color: 0xffdbac });

            // Kepala
            const head = new THREE.Mesh(new THREE.BoxGeometry(2, 2, 2), skin);
            head.position.y = 5; group.add(head);
            // Badan
            const body = new THREE.Mesh(new THREE.BoxGeometry(3, 3, 1.5), mat);
            body.position.y = 2.5; group.add(body);
            // Kaki (Kiri Kanan disatukan sederhana untuk awal)
            const legs = new THREE.Mesh(new THREE.BoxGeometry(2.8, 2, 1.4), new THREE.MeshLambertMaterial({color: 0x333333}));
            legs.position.y = 0; group.add(legs);

            group.castShadow = true;
            return group;
        }

        const kicker = createCharacter(0xff4757); // Baju Merah
        kicker.position.set(0, 1, 15); // Di belakang bola
        scene.add(kicker);

        const keeper = createCharacter(0x1e90ff); // Baju Biru
        keeper.position.set(0, 1, -19); // Di depan garis gawang
        scene.add(keeper);

        // Render Loop
        function animate() {
            requestAnimationFrame(animate);
            renderer.render(scene, camera);
        }
        animate();

        // Responsive window
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // ==========================================
        // 4. LOGIKA ANIMASI & GAME RESULT
        // ==========================================

        function showResultText(msg, color, duration = 2000) {
            const textEl = document.getElementById('result-text');
            textEl.innerHTML = msg;
            textEl.style.color = color;
            
            // Animasi CSS untuk UI Teks
            gsap.to(textEl, { opacity: 1, scale: 1, duration: 0.5, ease: "back.out(1.7)" });
            
            setTimeout(() => {
                gsap.to(textEl, { opacity: 0, scale: 0.5, duration: 0.3 });
            }, duration);
        }

        socket.on('roundResult', (data) => {
            document.getElementById('status-text').innerText = "Menembak!!!";

            // Tentukan target X bola dan kiper berdasarkan pilihan
            const targetXMap = { 'kiri': -8, 'tengah': 0, 'kanan': 8 };
            const ballX = targetXMap[data.kickerChoice];
            const keeperX = targetXMap[data.keeperChoice];

            // Sequence Animasi menggunakan GSAP
            const tl = gsap.timeline();

            // 1. Kicker maju ke arah bola
            tl.to(kicker.position, { z: 11.5, duration: 0.4, ease: "power1.in" });

            // 2. Bersamaan: Bola meluncur & Kiper Melompat
            tl.to(ball.position, {
                x: ballX,
                y: 2, // Bola sedikit melambung
                z: -21, // Melewati garis gawang
                duration: 0.6,
                ease: "power2.out"
            }, "+=0"); // Mulai segera setelah animasi sebelumnya selesai

            tl.to(ball.rotation, { x: "-=10", duration: 0.6 }, "<"); // Bola berputar

            // Animasi Kiper lompat
            tl.to(keeper.position, {
                x: keeperX,
                y: data.keeperChoice === 'tengah' ? 1 : 3, // Lompat jika ke samping
                duration: 0.5,
                ease: "power2.out"
            }, "<");
            
            if (data.keeperChoice !== 'tengah') {
                // Rotasi kiper saat melompat
                tl.to(keeper.rotation, { z: data.keeperChoice === 'kiri' ? 1.5 : -1.5, duration: 0.5 }, "<");
            }

            // 3. Tampilkan Teks Hasil
            tl.call(() => {
                showResultText(data.msg, data.isGoal ? '#2ecc71' : '#e74c3c');
                updateScoreBoard(data.players);
            });
        });

        socket.on('newRound', (game) => {
            document.getElementById('status-text').innerText = `Ronde ${game.round} Dimulai!`;
            
            // Reset Posisi 3D
            gsap.to(kicker.position, { x: 0, y: 1, z: 15, duration: 0.5 });
            gsap.to(keeper.position, { x: 0, y: 1, z: -19, duration: 0.5 });
            gsap.to(keeper.rotation, { z: 0, duration: 0.5 });
            
            // Reset Bola
            ball.position.set(0, 0.8, 10);
            ball.rotation.set(0, 0, 0);
        });

    </script>
</body>
</html>
